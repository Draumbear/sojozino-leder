<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Over mij — Sojozino</title>
<meta name="description" content="Maak kennis met Johnny Decoopman, lederbewerker achter Sojozino in Oostende.">
<link rel="icon" href="assets/logo-mark.png" type="image/png">
<link rel="stylesheet" href="styles.css?v=publish6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@300;400;500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="grain"></div>
<div id="siteHeader"></div>

<div class="about-page" id="aboutRoot">
  <img class="reveal" src="assets/about.jpg" alt="Johnny Decoopman" onerror="this.style.display='none'">
  <div>
    <p class="eyebrow reveal">Over Sojozino</p>
    <h1 class="reveal" id="aboutHeading" style="margin-bottom:1.4rem;">Over Sojozino</h1>
    <div id="aboutParagraphs"></div>
    <a class="btn reveal" href="contact.html" style="margin-top:1rem;">Neem contact op</a>
  </div>
</div>

<div id="siteFooter"></div>

<script src="site-data.js?v=publish6"></script>
<script>
document.addEventListener('site:loaded', (e) => {
  const site = e.detail;
  const esc = window.SojozinoSite.escapeHTML;
  document.getElementById('aboutHeading').textContent = site.aboutHeading || 'Over Sojozino';
  document.getElementById('aboutParagraphs').innerHTML =
    (site.aboutParagraphs || []).map(p => `<p class="reveal">${esc(p)}</p>`).join('');
  const img = document.querySelector('.about-page img');
  if (img && site.aboutPhoto?.src) { img.src = site.aboutPhoto.src; img.alt = site.aboutPhoto.alt || site.ownerName || ''; }
  window.SojozinoSite.initReveal();
});
</script>
</body>
</html>

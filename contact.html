<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Sojozino</title>
<meta name="description" content="Neem contact op met Sojozino voor vragen, herstellingen of werk op maat.">
<link rel="icon" href="assets/logo-mark.png" type="image/png">
<link rel="stylesheet" href="styles.css?v=63b5e400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@300;400;500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="grain"></div>
<div id="siteHeader"></div>

<div class="contact-page">
  <p class="eyebrow reveal">Contact</p>
  <h1 class="reveal">Vraag, herstelling of<br>iets op maat?</h1>
  <p class="reveal" style="max-width:44ch;margin:1rem auto 0;">Stuur gerust een bericht via mail of Instagram — ik antwoord zo snel mogelijk.</p>
  <div class="contact-links" id="contactLinks"></div>
</div>

<div id="siteFooter"></div>

<script src="site-data.js?v=63b5e400"></script>
<script>
document.addEventListener('site:loaded', (e) => {
  const site = e.detail;
  const esc = window.SojozinoSite.escapeHTML;
  const links = [];
  if (site.email) links.push(`<a class="contact-link reveal" href="mailto:${esc(site.email)}">&#9993; ${esc(site.email)}</a>`);
  if (site.instagramUrl) links.push(`<a class="contact-link reveal" href="${esc(site.instagramUrl)}" target="_blank" rel="noopener">&#64; Instagram</a>`);
  if (site.location) links.push(`<span class="contact-link reveal">&#128205; ${esc(site.location)}</span>`);
  document.getElementById('contactLinks').innerHTML = links.join('');
  window.SojozinoSite.initReveal();
});
</script>
</body>
</html>
